<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Alif Ba">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24707a"/>
      <stop offset="1" stop-color="#0f3a52"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="430">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#d9a032"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- achtpuntige ster op de achtergrond -->
  <g fill="none" stroke="#ffe08a" stroke-opacity=".22" stroke-width="5" stroke-linejoin="round" transform="translate(256 262)">
    <rect x="-170" y="-170" width="340" height="340"/>
    <rect x="-170" y="-170" width="340" height="340" transform="rotate(45)"/>
  </g>
  <!-- maansikkel en sterretje -->
  <path d="M120 88a42 42 0 1 0 36 62a34 34 0 1 1 -36 -62z" fill="url(#gold)"/>
  <path d="M176 82l6 15 16 2-12 11 4 16-14-9-14 9 4-16-12-11 16-2z" fill="url(#gold)" transform="translate(-4 -2)"/>
  <!-- alif (rechts) en ba (links), gelezen van rechts naar links -->
  <g fill="none" stroke="url(#gold)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M392 168V338"/>
    <path d="M118 282Q122 346 190 346H268Q326 346 330 288"/>
  </g>
  <circle cx="224" cy="410" r="23" fill="url(#gold)"/>
