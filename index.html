<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alif Ba Qur'ani</title>
  <meta name="theme-color" content="#b8862b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- App-startscherm: begroeting, voortgang, "verder leren"-CTA. Geen inhoudsopgave. -->
  <section id="appHome" class="screen"></section>

  <!-- Beloningen: XP, sterren, badges. -->
  <section id="rewards" class="screen" hidden></section>

  <!-- Profiel: kindprofiel + taal + oudergedeelte (instellingen, voortgang per kind). -->
  <section id="profileHub" class="screen" hidden></section>

  <!-- Onderste navigatie: Leren · Boek · Beloningen · Profiel -->
  <nav id="bottomNav" class="bottom-nav"></nav>

  <!-- Boekmodus: bestaande inhoudsopgave + lessen (los van de nieuwe leerervaring). -->
  <section id="home" class="screen" hidden>
    <header class="home-head">
      <div class="lang" role="group" aria-label="Taal · Language · اللغة">
        <button data-lang="ar" lang="ar">ع</button>
        <button data-lang="nl">NL</button>
        <button data-lang="en">EN</button>
      </div>
      <div class="home-title">
        <h1 lang="ar" dir="rtl">
          <span class="title-kicker">قاعدةالفتح الربَّاني</span>
          <span class="title-main">ألف با</span>
          <span class="title-main">قرءاني</span>
        </h1>
        <p data-i18n="subtitle">Inhoudsopgave · tik op een les</p>
      </div>

      <div class="home-progress">
        <svg class="op-ring" viewBox="0 0 40 40" aria-hidden="true">
          <circle class="op-ring-bg" cx="20" cy="20" r="17"/>
          <circle id="opRingFg" class="op-ring-fg" cx="20" cy="20" r="17"/>
        </svg>
        <span id="progressText" class="op-text"></span>
      </div>

      <button id="btnContinue" class="continue" hidden>
        <svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
        <span id="continueText"></span>
      </button>

      <div class="home-search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>
        <input id="searchInput" type="search" data-i18n-placeholder="search" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="searchClear" class="search-clear" hidden type="button" aria-label="×">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>
    <div id="toc" class="toc"></div>
  </section>

  <!-- Lesscherm: pagina met klikbare vierkanten -->
  <section id="lesson" class="screen" hidden>
    <nav class="bar">
      <button id="btnHome" class="icon-btn" data-i18n-aria="home" aria-label="Terug naar overzicht">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      </button>
      <div class="bar-title">
        <span class="bar-row">
          <span id="lessonNum" class="num"></span>
          <span id="lessonTitle" lang="ar" dir="rtl"></span>
        </span>
        <span id="chapterLine" class="chapter-line"></span>
      </div>
      <button id="btnPlayAll" class="icon-btn play" data-i18n-aria="playAll" aria-label="Alles afspelen">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </nav>

    <div id="stageWrap" class="stage-wrap">
      <div id="stage" class="stage">
        <img id="pageImg" alt="">
        <div id="hotspots" class="hotspots"></div>
      </div>
    </div>

    <footer class="pager">
      <!-- Arabisch boek: "volgende" staat links, "vorige" rechts -->
      <button id="btnNext" class="pg-btn" data-i18n-aria="next" aria-label="Volgende pagina">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="pager-mid">
        <span id="chapterDots" class="ch-dots" dir="rtl"></span>
        <span id="pageDots" class="dots"></span>
      </div>
      <button id="btnPrev" class="pg-btn" data-i18n-aria="prev" aria-label="Vorige pagina">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </footer>

    <div id="editBar" class="edit-bar" hidden>
      <strong>Bewerkmodus</strong>
      <span>Sleep om een vierkant te tekenen · klik om te selecteren · Delete om te verwijderen</span>
      <button id="btnExport">Exporteer book-data.js</button>
    </div>
  </section>

  <!-- Hoofdstukkaart: verschijnt bij het bladeren naar een nieuw hoofdstuk -->
  <div id="splash" class="splash" hidden>
    <div class="splash-card" role="dialog" aria-modal="true" aria-labelledby="splashAr">
      <span id="splashKicker" class="splash-kicker"></span>
      <span id="splashNum" class="splash-num"></span>
      <h2 id="splashAr" lang="ar" dir="rtl"></h2>
      <p id="splashSub" class="splash-sub"></p>
      <p id="splashCount" class="splash-count"></p>
      <button id="splashGo" class="continue"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg><span id="splashGoText"></span></button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Spelmodus: kinderprofielen, levelkaart, oefeningen. Los van de boekmodus hierboven. -->
  <section id="game" class="screen" hidden>
    <div id="gProfile" class="g-screen"></div>
    <div id="gMap" class="g-screen" hidden></div>
    <div id="gLevel" class="g-screen" hidden></div>
    <div id="gComplete" class="g-overlay" hidden></div>
  </section>

  <script src="book-data.js"></script>
  <script src="voice-manifest.js"></script>
  <script src="audio-manager.js"></script>
  <script src="app.js"></script>
  <script src="game-data.js"></script>
  <script src="game.js"></script>
  <script src="shell.js"></script>
</body>
</html>
